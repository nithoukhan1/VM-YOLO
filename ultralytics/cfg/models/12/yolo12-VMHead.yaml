# VM-Neck-YOLOv12: Standard Backbone + Mamba-Fused Neck + DySample

# Parameters
nc: 9 # Your 9 classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# 1. Backbone (Standard CNN for Speed)
# We keep this standard to avoid the "Traffic Jam" issue of Mamba on large images.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, C3k2, [256, False, 0.25]] # 2-P3/8 (CNN - Fast)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, C3k2, [512, False, 0.25]] # 4-P4/16 (CNN - Fast)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# 2. Neck & Head (Mamba-Enhanced Fusion)
# Mamba blocks are placed here to fuse context globally.
head:
  - [-1, 1, DySample, [2]] # 9 (Novelty: Dynamic Upsampling)
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4

  # --- CHANGE 1: Mamba Fusion (Medium Scale) ---
  # Fuses P4 context. Replaces A2C2f with VSSBlock.
  - [-1, 1, VSSBlock, [512]] # 11

  - [-1, 1, DySample, [2]] # 12 (Novelty: Dynamic Upsampling)
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3

  # --- CHANGE 2: Mamba Fusion (Large Scale) ---
  # Fuses P3 context. This is critical for connecting "Soft Tissue" to "Fracture".
  - [-1, 1, VSSBlock, [256]] # 14

  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4

  # --- CHANGE 3: Mamba Fusion (Medium Scale) ---
  # Fuses P4 again for detection path.
  - [-1, 1, VSSBlock, [512]] # 17

  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P5

  # --- CHANGE 4: Mamba Fusion (Small Scale) ---
  # Fuses P5 (Deepest features).
  - [-1, 1, VSSBlock, [1024]] # 20

  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P3, P4, P5)
