# VM-Dy-YOLOv12: Hybrid Architecture (CNN Early + Mamba Deep) + DySample

# Parameters
nc: 9 # <--- 9 classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# VM-Dy-YOLOv12 Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, C3k2, [256, True, 0.5]] # 2 <--- FAST CNN Block (P3)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8.
  - [-1, 1, VSSBlock, [512]] # 4 <--- NOVEL Mamba Block (P4)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# VM-Dy-YOLOv12 Head
head:
  - [-1, 1, DySample, [2]] # 9 <--- Novelty: Dynamic Upsampling
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, DySample, [2]] # 12 <--- Novelty: Dynamic Upsampling
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3 (Note: P3 is now C3k2)
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P3, P4, P5)
